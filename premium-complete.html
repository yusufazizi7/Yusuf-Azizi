<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <meta name="robots" content="noindex">
    <title>Premium Payment | Islamic Qalam</title>

    <link rel="icon" type="image/png" href="/images/website-favicon.png">

    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/premium-checkout.css">

    <script src="https://kit.fontawesome.com/50f622582e.js" crossorigin="anonymous"></script>
</head>

<body>
    <header class="site-header">
        <div class="brand">
            <a class="brand" href="/" aria-label="Islamic Qalam homepage">
                <svg class="website-logo" aria-hidden="true">
                    <use href="/images/website-logo.svg#website-logo">
                    </use>
                </svg>
            </a>
            <span class="brand-name">Islamic Qalam</span>
        </div>

        <nav id="primary-navigation" class="navbar" aria-label="Main navigation">
            <a href="/e-books.html">E-books</a>
            <a href="/premium.html">Premium</a>
            <a href="/contact-us.html">Contact</a>

            <a id="navAccountLink" class="nav-login" href="/login.html">
                <i class="fa-solid fa-right-to-bracket" aria-hidden="true"></i>
                <span id="navAccountText">Login</span>
            </a>

            <a id="navPremiumLink" class="nav-premium" href="/premium.html" hidden>
                <i class="fa-solid fa-crown" aria-hidden="true"></i>
                Premium
            </a>
        </nav>

        <button id="menu-bars" class="menu-toggle" type="button" aria-label="Open navigation menu"
            aria-controls="primary-navigation" aria-expanded="false">
            <i class="fa-solid fa-bars" aria-hidden="true"></i>
        </button>
    </header>

    <main class="premium-checkout-main">
        <section class="checkout-complete-card" aria-live="polite">

            <div id="paymentStatusIcon" class="checkout-complete-icon">
                <i class="fa-solid fa-spinner fa-spin" aria-hidden="true"></i>
            </div>

            <h1 id="paymentStatusTitle">
                Confirming your membership
            </h1>

            <p id="paymentStatusMessage">
                We're checking that your payment has been
                recorded and your Premium access is ready.
            </p>

            <a id="paymentLibraryLink" href="/e-books.html" class="checkout-pay-button" hidden>
                Explore Premium E-books
                <i class="fa-solid fa-arrow-right" aria-hidden="true"></i>
            </a>

            <a href="/profile.html?premium=1" class="checkout-complete-secondary">
                Go to My Profile
            </a>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>
    <script src="/supabase/supabase-client.js"></script>
    <script src="/scripts/global.js"></script>
    <script src="/scripts/side-bar.js"></script>
    <script src="/scripts/premium-complete.js"></script>
</body>

</html>
