<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="description" content="Retrieve your downloaded e-books from Islamic Qalam." />

    <title>
        Retrieve Download | Islamic Qalam
    </title>

    <link rel="stylesheet" href="CSS/global.css" />
    <link rel="stylesheet" href="CSS/retrieve-download.css" />



    <link rel="icon" type="image/png" href="Images/website-favicon.png" />

    <script src="https://kit.fontawesome.com/50f622582e.js" crossorigin="anonymous"></script>
</head>


<body>

    <!-- ================= HEADER ================= -->

    <header class="site-header">

        <div class="brand">

            <object class="website-logo" data="Images/Website-logo.svg" type="image/svg+xml"
                aria-label="Islamic Qalam logo"></object>

            <span class="brand-name">
                Islamic Qalam
            </span>

        </div>


        <nav id="primary-navigation" class="navbar" aria-label="Main navigation">

            <a href="index.html#poetry-library">
                Poetry
            </a>

            <a href="quran.html">
                Qur'an
            </a>

            <a href="videos.html">
                Videos
            </a>

            <a href="e-books.html">
                E-books
            </a>

            <a href="contact-us.html">
                Contact
            </a>

            

            <a id="navAccountLink" class="nav-login" href="login.html">
                <i class="fa-solid fa-right-to-bracket" aria-hidden="true"></i>

                <span id="navAccountText">
                    Login
                </span>
            </a>

        </nav>


        <button id="menu-bars" class="menu-toggle" type="button" aria-label="Open navigation menu"
            aria-controls="primary-navigation" aria-expanded="false">
            <i class="fa-solid fa-bars" aria-hidden="true"></i>
        </button>

    </header>


    <main class="retrieve-main">

        <section class="retrieve-card">

            <div class="retrieve-icon">
                <i class="fa-solid fa-envelope-open-text" aria-hidden="true"></i>
            </div>

            <p class="section-kicker">
                Purchased E-books
            </p>

            <h1>
                Retrieve Download Link
            </h1>

            <p class="retrieve-description">
                Enter the email address you used when
                purchasing your e-book. We'll send you
                a new download link.
            </p>


            <form id="retrieveDownloadForm" novalidate>

                <div class="retrieve-field">

                    <label for="retrieveEmail">
                        Purchase email
                    </label>

                    <input id="retrieveEmail" name="email" type="email" autocomplete="email"
                        placeholder="you@example.com" required />

                </div>


                <p id="retrieveMessage" class="retrieve-message" role="status" aria-live="polite" hidden></p>


                <button id="retrieveButton" class="retrieve-button" type="submit">
                    <i class="fa-regular fa-envelope" aria-hidden="true"></i>

                    Send Download Link
                </button>

            </form>


            <p class="retrieve-help">
                If you purchased while signed in,
                you can access your e-books from
                Purchased Items in your profile.
            </p>

        </section>

    </main>


    <!-- ================= SCRIPTS ================= -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="Supabase/supabase-client.js"></script>

    <script src="Scripts/global.js"></script>
    <script src="Scripts/SideBar.js"></script>

    <script src="Scripts/retrieve-download.js"></script>


</body>

</html>
